controllers:
  - id: volume
    label: Volume
    adc_channel: 0
    range: [0, 1]
    taper: linear
    default: 0.8
buttons:
  - id: bypass
    label: Bypass
    gpio_pin: 28
    mode: toggle
    active_level: low
  - id: boost
    label: Boost
    gpio_pin: 25
    mode: momentary
    active_level: low
leds:
  - id: status
    label: Status (onboard)
    gpio_pin: 23
  - id: boost_led
    label: Boost LED
    gpio_pin: 18
