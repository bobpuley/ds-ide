# Publishes a tagged release to the Visual Studio Marketplace (FR-RLS-4).
#
# Manual only: run it from the Actions tab and give the tag to publish. Leave
# dry_run on to check that the whole pipeline works without publishing. It uses
# Trusted Publishing (OIDC): no token or secret is stored anywhere. The matching
# policy is set up on the Marketplace publisher page (Trusted Publishing:
# repository owner, repository, and this workflow's filename, `publish.yml`).
#
# The package is built on an Apple Silicon runner, because it ships a native
# addon built for Electron and is published for darwin-arm64 only. Every
# release is a Marketplace pre-release while the extension is in preview.
name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example 0.25.0 (a branch name such as main works for a dry run)
        required: true
        type: string
      dry_run:
        description: Build, test and verify only; do not publish
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package -- --pre-release
      - run: npm run verify:package
      - if: ${{ !inputs.dry_run }}
        run: npx vsce publish --oidc --packagePath ds-ide-darwin-arm64-*.vsix
