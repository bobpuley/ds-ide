<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daisy Scope — Mockup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1e1e; color: #d4d4d4; font-family: monospace; font-size: 12px; display: flex; flex-direction: column; height: 100vh; border: 1px solid #3c3c3c; }
    header { padding: 6px 12px; background: #252526; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #3c3c3c; flex-wrap: wrap; }
    #output-vol-control { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .vol-label { color: #9cdcfe; font-size: 12px; }
    #output-vol { width: 72px; cursor: pointer; }
    #output-vol-val { color: #b5cea8; min-width: 28px; }
    #fidelity-caveat { font-size: 10px; color: #6a6a6a; cursor: default; }
    #status-text { flex: 1; }
    .legend { display: flex; gap: 12px; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-in  { background: #4ec9b0; }
    .dot-out { background: #ce9178; }
    #events { padding: 3px 12px; min-height: 22px; background: #252526; border-bottom: 1px solid #3c3c3c; font-size: 11px; color: #f48771; }
    canvas { display: block; width: 100%; }
    #scope { flex: 1; min-height: 80px; }
    #spectrum { height: 140px; border-top: 1px solid #3c3c3c; background: #1a1a1a; flex-shrink: 0; min-height: 0; }
    #audio-source-bar { padding: 6px 12px; background: #252526; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .source-label { color: #9cdcfe; }
    .source-option { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .source-option input[type="radio"] { cursor: pointer; accent-color: #4ec9b0; }
    .source-sep { color: #3c3c3c; user-select: none; }
    .source-field { display: flex; align-items: center; gap: 6px; }
    .source-field select, #audio-input { background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; padding: 2px 4px; font-family: monospace; cursor: pointer; }
    .latency-text { color: #b5cea8; }
    .xrun-text { color: #b5cea8; }
    .xrun-text.xrun-warning { color: #f48771; }
    #wav-controls { padding: 6px 12px; background: #252526; border-top: 1px solid #2e2e2e; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .wav-label { color: #9cdcfe; }
    #wav-choose { background: #0e639c; color: #fff; border: none; padding: 3px 10px; font-family: monospace; cursor: pointer; border-radius: 2px; }
    #wav-choose:hover { background: #1177bb; }
    .wav-name { color: #b5cea8; font-style: italic; }
    .section-label { color: #9cdcfe; align-self: center; }
    #buttons { padding: 8px 12px; background: #252526; border-top: 1px solid #2e2e2e; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .vbutton { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; border-radius: 4px; padding: 6px 12px; font-family: monospace; cursor: pointer; user-select: none; }
    .vbutton:active { background: #4a4a4a; }
    .vbutton-on { background: #0e639c; border-color: #1177bb; color: #fff; }
    .vbutton-label { font-size: 12px; }
    .vbutton-pin { font-size: 9px; color: #9a9a9a; }
    .vbutton-on .vbutton-pin { color: #cfe8ff; }
    #leds { padding: 8px 12px; background: #252526; border-top: 1px solid #2e2e2e; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    .vled { display: flex; align-items: center; gap: 6px; }
    .vled-dot { width: 12px; height: 12px; border-radius: 50%; background: #3c3c3c; border: 1px solid #555; box-shadow: none; }
    .vled-dot.vled-lit { background: #f04a4a; border-color: #ff6a6a; box-shadow: 0 0 6px 1px #f04a4a; }
    .vled-label { color: #b5cea8; }
    .wav-loop { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .wav-loop input { cursor: pointer; accent-color: #4ec9b0; }
    #sine-controls { padding: 6px 12px; background: #252526; border-top: 1px solid #2e2e2e; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .sine-label { color: #9cdcfe; }
    .sine-field { display: flex; align-items: center; gap: 6px; }
    .sine-field input[type="number"] { width: 68px; background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; padding: 2px 4px; font-family: monospace; }
    .sine-field input[type="range"] { width: 100px; cursor: pointer; }
    #controllers { padding: 8px 12px; background: #252526; display: flex; flex-wrap: wrap; gap: 16px; }
    .pot { display: flex; align-items: center; gap: 8px; }
    .pot-label { min-width: 80px; color: #9cdcfe; }
    .pot-slider { width: 140px; cursor: pointer; }
    .pot-value { min-width: 40px; text-align: right; color: #b5cea8; }
    #recording-bar { padding: 6px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0; }
    .ctrl-section { flex-shrink: 0; border-top: 1px solid #3c3c3c; }
    .section-toggle { width: 100%; padding: 5px 12px; background: #2a2a2a; color: #9a9a9a; border: none; border-bottom: 1px solid transparent; display: flex; align-items: center; gap: 7px; font-family: monospace; font-size: 11px; cursor: pointer; text-align: left; user-select: none; letter-spacing: 0.3px; }
    .section-toggle:hover { background: #303030; color: #d4d4d4; }
    .section-toggle[aria-expanded="true"] { border-bottom-color: #3c3c3c; color: #d4d4d4; }
    .toggle-arrow { font-size: 10px; width: 10px; display: inline-block; }
    .section-body { display: flex; flex-direction: column; }
    #emulator-bar { padding: 6px 12px; background: #252526; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #emulator-bar select, #emulator-bar input[type="number"] { background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; padding: 2px 4px; font-family: monospace; font-size: 12px; cursor: pointer; }
    #emulator-bar input[type="number"] { width: 58px; }
    #emulator-bar input[type="range"] { width: 80px; cursor: pointer; vertical-align: middle; }
    .emu-label { color: #9cdcfe; }
    .emu-field { display: inline-flex; align-items: center; gap: 5px; }
    .emu-inline-group { display: inline-flex; align-items: center; gap: 8px; }
    .strong-sep { display: inline-block; width: 1px; height: 18px; background: #555; margin: 0 6px; vertical-align: middle; }
    .rec-label { color: #9cdcfe; }
    .rec-btn { background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; padding: 3px 10px; font-family: monospace; font-size: 12px; cursor: pointer; border-radius: 2px; }
    .rec-btn:hover { background: #4a4a4a; }
    .rec-btn:disabled { opacity: 0.4; cursor: default; }
    #rec-start-btn { border-color: #c94040; color: #f48771; }
    #rec-start-btn:hover:not(:disabled) { background: #5a1a1a; }
    #rec-start-btn.recording { background: #c94040; color: #fff; border-color: #ff6060; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0.5; } }
    #replay-start-btn { border-color: #4ec9b0; color: #4ec9b0; }
    #replay-start-btn:hover:not(:disabled) { background: #1a3a35; }
    #replay-start-btn.replaying { background: #1e5a4a; color: #fff; }
    .rec-filename { color: #b5cea8; font-style: italic; font-size: 11px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #getting-started { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #6a6a6a; padding: 32px; text-align: center; }
    #getting-started ol { text-align: left; padding-left: 20px; line-height: 2; }
    #getting-started code { background: #3c3c3c; padding: 1px 4px; border-radius: 2px; color: #9cdcfe; }
    #tab-bar { display: flex; background: #2d2d30; border-bottom: 1px solid #3c3c3c; flex-shrink: 0; }
    .tab { background: transparent; color: #9a9a9a; border: none; border-bottom: 2px solid transparent; padding: 7px 18px; cursor: pointer; font-family: monospace; font-size: 12px; }
    .tab:hover { color: #d4d4d4; background: #37373d; }
    .tab-active { color: #fff; border-bottom-color: #4ec9b0; }
    #scope-content { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    #editor-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #editor-toolbar { padding: 6px 12px; background: #252526; border-bottom: 1px solid #3c3c3c; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #save-btn { background: #0e639c; color: #fff; border: none; padding: 4px 14px; font-family: monospace; cursor: pointer; border-radius: 2px; font-size: 12px; }
    #save-btn:hover { background: #1177bb; }
    #save-status { font-size: 11px; color: #b5cea8; }
    #editor-main { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    #palette { width: 140px; background: #252526; border-right: 1px solid #3c3c3c; padding: 10px 8px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; overflow-y: auto; }
    .palette-title { font-size: 10px; color: #6a6a6a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
    .palette-item { padding: 7px 10px; border-radius: 4px; border: 1px solid #555; background: #3c3c3c; color: #d4d4d4; cursor: grab; user-select: none; font-size: 11px; text-align: center; }
    .palette-item:hover { background: #4a4a4a; }
    .palette-item[data-kind="pot"]    { border-left: 3px solid #4ec9b0; }
    .palette-item[data-kind="button"] { border-left: 3px solid #569cd6; }
    .palette-item[data-kind="led"]    { border-left: 3px solid #f04a4a; }
    #canvas-area { flex: 1; position: relative; overflow: auto; background: #1e1e1e; }
    #canvas-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #3c3c3c; font-size: 13px; pointer-events: none; }
    .ctrl-card { position: absolute; min-width: 168px; background: #252526; border: 1px solid #555; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
    .ctrl-card[data-kind="pot"]    { border-top: 3px solid #4ec9b0; }
    .ctrl-card[data-kind="button"] { border-top: 3px solid #569cd6; }
    .ctrl-card[data-kind="led"]    { border-top: 3px solid #f04a4a; }
    .card-header { padding: 4px 6px 4px 8px; display: flex; align-items: center; justify-content: space-between; cursor: move; background: rgba(255,255,255,0.03); }
    .card-kind { font-size: 9px; color: #6a6a6a; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-del { background: none; border: none; color: #555; cursor: pointer; font-size: 15px; padding: 0 2px; line-height: 1; }
    .card-del:hover { color: #f04a4a; }
    .card-body { padding: 5px 8px 8px; display: flex; flex-direction: column; gap: 4px; }
    .card-field { display: flex; align-items: center; gap: 5px; }
    .card-field label { font-size: 10px; color: #9a9a9a; min-width: 46px; }
    .card-inp { background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; padding: 2px 4px; font-family: monospace; font-size: 11px; flex: 1; min-width: 0; }
    .card-sel { background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; padding: 2px 4px; font-family: monospace; font-size: 11px; flex: 1; }
  </style>
</head>
<body>
  <div id="tab-bar">
    <button class="tab tab-active" id="tab-scope-btn">Scope</button>
    <button class="tab" id="tab-editor-btn">Controller Editor</button>
  </div>

  <!-- ── Scope tab ─────────────────────────────────────────────────────── -->
  <div id="scope-content">
    <header>
      <span id="status-text">▶ Running  |  48000 Hz  |  block 256  |  xruns: 0</span>
      <span class="legend">
        <span><span class="dot dot-in"></span>In</span>
        <span><span class="dot dot-out"></span>Out</span>
      </span>
      <label id="output-vol-control" title="Master output volume">
        <span class="vol-label">Vol</span>
        <input type="range" id="output-vol" min="0" max="1" step="0.01" value="0.8"/>
        <span id="output-vol-val">0.80</span>
      </label>
      <span id="fidelity-caveat" title="Emulator approximates the Seed — not bit-exact">ℹ Approx. Seed</span>
    </header>
    <div id="events"></div>
    <canvas id="scope"></canvas>
    <canvas id="spectrum"></canvas>

    <!-- ── Effect controls (expanded by default) ── -->
    <div class="ctrl-section">
      <button class="section-toggle" data-target="effect-body" aria-expanded="true">
        <span class="toggle-arrow">▾</span> Effect controls
      </button>
      <div id="effect-body" class="section-body">
        <div id="controllers">
          <div class="pot" data-channel="0">
            <span class="pot-label">Frequency</span>
            <input type="range" class="pot-slider" min="0" max="1" step="0.001" value="0.420" data-channel="0"/>
            <span class="pot-value">0.420</span>
          </div>
          <div class="pot" data-channel="1">
            <span class="pot-label">Resonance</span>
            <input type="range" class="pot-slider" min="0" max="1" step="0.001" value="0.650" data-channel="1"/>
            <span class="pot-value">0.650</span>
          </div>
          <div class="pot" data-channel="2">
            <span class="pot-label">Drive</span>
            <input type="range" class="pot-slider" min="0" max="1" step="0.001" value="0.200" data-channel="2"/>
            <span class="pot-value">0.200</span>
          </div>
        </div>
        <div id="buttons">
          <span class="section-label">Buttons:</span>
          <button class="vbutton" type="button" data-pin="0" data-mode="momentary" aria-pressed="false">
            <span class="vbutton-label">Bypass</span>
            <span class="vbutton-pin">pin 0</span>
          </button>
          <button class="vbutton vbutton-on" type="button" data-pin="1" data-mode="toggle" aria-pressed="true">
            <span class="vbutton-label">Mode</span>
            <span class="vbutton-pin">pin 1 · toggle</span>
          </button>
        </div>
        <div id="leds">
          <span class="section-label">LEDs:</span>
          <div class="vled" data-pin="2">
            <span class="vled-dot" data-pin="2"></span>
            <span class="vled-label">Active</span>
          </div>
          <div class="vled" data-pin="3">
            <span class="vled-dot vled-lit" data-pin="3"></span>
            <span class="vled-label">Clip</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Emulator controls (collapsed by default) ── -->
    <div class="ctrl-section">
      <button class="section-toggle" data-target="emulator-body" aria-expanded="false">
        <span class="toggle-arrow">▸</span> Emulator
      </button>
      <div id="emulator-body" class="section-body" style="display:none">
        <div id="emulator-bar">
          <span class="emu-label">Input:</span>
          <select id="audio-input">
            <option value="sine" selected>Sine</option>
            <option value="live">Live (mic)</option>
            <option value="wav">WAV</option>
          </select>
          <!-- sine only -->
          <span id="sine-params" class="emu-inline-group">
            <span class="source-sep">|</span>
            <label class="emu-field">Freq <input type="number" id="sine-freq" min="20" max="20000" step="1" value="440"/> Hz</label>
            <label class="emu-field">Amp <input type="range" id="sine-amp" min="0" max="1" step="0.01" value="0.5"/> <span id="sine-amp-val">0.50</span></label>
          </span>
          <!-- wav only -->
          <span id="wav-params" class="emu-inline-group" style="display:none">
            <span class="source-sep">|</span>
            <button id="wav-choose" type="button">Choose WAV…</button>
            <span id="wav-name" class="wav-name">no file selected</span>
            <label class="emu-field"><input type="checkbox" id="wav-loop" checked/> Loop</label>
          </span>
          <!-- live + wav -->
          <span id="buffer-params" class="emu-inline-group" style="display:none">
            <span class="source-sep">|</span>
            <label class="emu-field">Buffer <select id="buffer-size"><option>64</option><option>128</option><option selected>256</option><option>512</option></select> samples</label>
          </span>
          <!-- live only -->
          <span id="latency-params" class="emu-inline-group" style="display:none">
            <span class="source-sep">|</span>
            <span id="latency-display" class="latency-text">latency: 5.3 ms</span>
          </span>
          <!-- live + wav -->
          <span id="xrun-params" class="emu-inline-group" style="display:none">
            <span class="source-sep">|</span>
            <span id="xrun-display" class="xrun-text">xruns: 0</span>
          </span>
          <span class="strong-sep"></span>
          <button id="rec-start-btn" class="rec-btn" type="button">&#9679; Record</button>
          <button id="rec-stop-btn"  class="rec-btn" type="button" disabled>&#9632; Stop</button>
          <button id="replay-start-btn" class="rec-btn" type="button">&#9654; Replay&hellip;</button>
          <span id="rec-filename" class="rec-filename"></span>
        </div>
      </div>
    </div>
  </div><!-- #scope-content -->

  <!-- ── Controller Editor tab ─────────────────────────────────────────── -->
  <div id="editor-wrap" style="display:none">
    <div id="editor-toolbar">
      <button id="save-btn">Save controllers.yaml</button>
      <span id="save-status"></span>
    </div>
    <div id="editor-main">
      <div id="palette">
        <div class="palette-title">Palette</div>
        <div class="palette-item" data-kind="pot" draggable="true">Pot</div>
        <div class="palette-item" data-kind="button" draggable="true">Button</div>
        <div class="palette-item" data-kind="led" draggable="true">LED</div>
      </div>
      <div id="canvas-area">
        <div id="canvas-hint">Drag a control from the palette</div>
      </div>
    </div>
  </div>

  <script>
    // ── vscode API stub (no-op in browser) ──────────────────────────────
    const vscode = { postMessage: (m) => console.log('[vscode]', m) };

    // ── Fake data generation ─────────────────────────────────────────────
    function makeSine(N, freq, phase, amp) {
      return Array.from({ length: N }, (_, i) => amp * Math.sin(2 * Math.PI * freq * i / N + phase));
    }
    function makeSpectrum(N, peakBin, amp) {
      return Array.from({ length: N }, (_, i) => amp * Math.exp(-0.5 * Math.pow((i - peakBin) / 3, 2)));
    }

    let lastIn  = makeSine(512, 3, 0, 0.6);
    let lastOut = makeSine(512, 3, 0.3, 0.45);
    let lastSpecIn  = makeSpectrum(512, 30, 1.0);
    let lastSpecOut = makeSpectrum(512, 30, 0.7);
    let lastBinHz = 48000 / 1024;

    // Animate fake waveforms
    let t = 0;
    setInterval(() => {
      t += 0.04;
      lastIn  = makeSine(512, 3, t, 0.6);
      lastOut = makeSine(512, 3, t + 0.3, 0.45);
      draw();
    }, 30);

    // ── Canvas refs ──────────────────────────────────────────────────────
    const canvas    = document.getElementById('scope');
    const ctx       = canvas.getContext('2d');
    const specCanvas = document.getElementById('spectrum');
    const specCtx   = specCanvas.getContext('2d');

    // [SYNC] draw — mirrors scope-panel.ts drawSpectrum/draw/drawWave block
    function draw() {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#1e1e1e';
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = '#3c3c3c';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2);
      ctx.moveTo(0, H / 4); ctx.lineTo(W, H / 4);
      ctx.moveTo(0, 3 * H / 4); ctx.lineTo(W, 3 * H / 4);
      ctx.stroke();

      drawWave(lastIn,  '#4ec9b0');
      drawWave(lastOut, '#ce9178');
    }

    // [SYNC] drawWave
    function drawWave(pts, color) {
      if (!pts || pts.length < 2) return;
      const W = canvas.width, H = canvas.height;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const x = (i / (pts.length - 1)) * W;
        const y = H / 2 - pts[i] * (H / 2 * 0.9);
        if (i === 0) ctx.moveTo(x, y);
        else         ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // [SYNC] drawSpectrum
    function drawSpectrum() {
      const W = specCanvas.width, H = specCanvas.height;
      specCtx.clearRect(0, 0, W, H);
      specCtx.fillStyle = '#1a1a1a';
      specCtx.fillRect(0, 0, W, H);
      if (!lastSpecIn || lastSpecIn.length < 2) return;

      const N = lastSpecIn.length;
      const maxFreq = Math.min(20000, lastBinHz * N);
      const maxBin  = lastBinHz > 0 ? Math.min(N, Math.ceil(maxFreq / lastBinHz)) : N;
      const peak = Math.max(
        lastSpecIn.slice(0, maxBin).reduce((a, v) => Math.max(a, v), 1e-9),
        lastSpecOut.slice(0, maxBin).reduce((a, v) => Math.max(a, v), 1e-9),
      );

      // Margins: left for dB labels, bottom for freq labels
      const LEFT = 36, BOTTOM = 16, TOP = 4;
      const plotW = W - LEFT;
      const plotH = H - BOTTOM - TOP;
      const ampToY = (amp) => TOP + plotH * (1 - amp / peak);

      // Grid lines (dB: 0, -20, -40, -60) + y-axis labels (left of plot)
      specCtx.font = '9px monospace';
      specCtx.textAlign = 'right';
      let lastDbLabelY = -Infinity;
      for (let db = 0; db >= -60; db -= 20) {
        const y = ampToY(Math.pow(10, db / 20) * peak);
        specCtx.strokeStyle = '#2a2a2a';
        specCtx.lineWidth = 1;
        specCtx.beginPath();
        specCtx.moveTo(LEFT, y); specCtx.lineTo(W, y);
        specCtx.stroke();
        if (y - lastDbLabelY >= 11) {
          specCtx.fillStyle = '#777';
          specCtx.fillText(db + 'dB', LEFT - 4, y + 4);
          lastDbLabelY = y;
        }
      }
      specCtx.textAlign = 'left';

      // x-axis baseline
      specCtx.strokeStyle = '#3c3c3c';
      specCtx.lineWidth = 1;
      specCtx.beginPath();
      specCtx.moveTo(LEFT, TOP + plotH); specCtx.lineTo(W, TOP + plotH);
      specCtx.stroke();

      function drawSpecLine(fft, color) {
        specCtx.strokeStyle = color;
        specCtx.lineWidth = 1.5;
        specCtx.beginPath();
        for (let i = 0; i < maxBin; i++) {
          const x = LEFT + (i / (maxBin - 1)) * plotW;
          const y = ampToY(fft[i]);
          if (i === 0) specCtx.moveTo(x, y);
          else         specCtx.lineTo(x, y);
        }
        specCtx.stroke();
      }

      drawSpecLine(lastSpecIn,  '#4ec9b0');
      drawSpecLine(lastSpecOut, '#ce9178');

      // Frequency axis labels — skip any label that would overlap the previous one
      if (lastBinHz > 0) {
        specCtx.fillStyle = '#999';
        specCtx.font = '10px monospace';
        specCtx.textAlign = 'left';
        const freqLabels = [1000, 2000, 5000, 10000, 20000];
        let lastLabelRight = LEFT - 4;
        for (const f of freqLabels) {
          if (f > maxFreq) break;
          const x = LEFT + (f / maxFreq) * plotW;
          const text = f >= 1000 ? (f / 1000) + 'k' : String(f);
          if (x < lastLabelRight + 4) continue;
          specCtx.fillText(text, x + 2, H - 4);
          lastLabelRight = x + 2 + specCtx.measureText(text).width;
        }
      }
    }

    // ResizeObserver keeps canvas buffer in sync with its CSS layout size.
    const ro = new ResizeObserver(() => {
      canvas.width      = canvas.clientWidth;
      canvas.height     = canvas.clientHeight;
      specCanvas.width  = specCanvas.clientWidth;
      specCanvas.height = specCanvas.clientHeight;
      draw();
      drawSpectrum();
    });
    ro.observe(canvas);
    ro.observe(specCanvas);

    // ── Collapsible sections ─────────────────────────────────────────────
    document.querySelectorAll('.section-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        const body = document.getElementById(btn.dataset.target);
        const arrow = btn.querySelector('.toggle-arrow');
        btn.setAttribute('aria-expanded', !expanded);
        body.style.display = expanded ? 'none' : 'flex';
        arrow.textContent = expanded ? '▸' : '▾';
      });
    });

    // ── Audio source: show/hide relevant controls per source ─────────────
    const audioInputEl = document.getElementById('audio-input');

    function show(id, visible) {
      document.getElementById(id).style.display = visible ? 'inline-flex' : 'none';
    }

    function updateEmulatorBar() {
      const src = audioInputEl.value;
      show('sine-params',    src === 'sine');
      show('wav-params',     src === 'wav');
      show('buffer-params',  src === 'live' || src === 'wav');
      show('latency-params', src === 'live');
      show('xrun-params',    src === 'live' || src === 'wav');
    }

    audioInputEl.addEventListener('change', updateEmulatorBar);
    updateEmulatorBar();

    // ── Output volume ────────────────────────────────────────────────────
    const outputVolEl    = document.getElementById('output-vol');
    const outputVolValEl = document.getElementById('output-vol-val');
    outputVolEl.addEventListener('input', () => {
      outputVolValEl.textContent = parseFloat(outputVolEl.value).toFixed(2);
      vscode.postMessage({ command: 'outputVolume', value: parseFloat(outputVolEl.value) });
    });

    // ── Sine controls ────────────────────────────────────────────────────
    const sineAmpEl    = document.getElementById('sine-amp');
    const sineAmpValEl = document.getElementById('sine-amp-val');
    sineAmpEl.addEventListener('input', () => {
      sineAmpValEl.textContent = parseFloat(sineAmpEl.value).toFixed(2);
    });

    // ── Pot sliders ──────────────────────────────────────────────────────
    document.querySelectorAll('.pot-slider').forEach(slider => {
      slider.addEventListener('input', () => {
        slider.closest('.pot').querySelector('.pot-value').textContent =
          parseFloat(slider.value).toFixed(3);
      });
    });

    // ── Virtual buttons ──────────────────────────────────────────────────
    document.querySelectorAll('.vbutton').forEach(btn => {
      const mode = btn.dataset.mode;
      if (mode === 'toggle') {
        btn.addEventListener('click', () => {
          const next = btn.getAttribute('aria-pressed') !== 'true';
          btn.classList.toggle('vbutton-on', next);
          btn.setAttribute('aria-pressed', next ? 'true' : 'false');
        });
      } else {
        btn.addEventListener('mousedown',  () => { btn.classList.add('vbutton-on');    btn.setAttribute('aria-pressed','true'); });
        btn.addEventListener('mouseup',    () => { btn.classList.remove('vbutton-on'); btn.setAttribute('aria-pressed','false'); });
        btn.addEventListener('mouseleave', () => { btn.classList.remove('vbutton-on'); btn.setAttribute('aria-pressed','false'); });
      }
    });

    // ── Recording bar ────────────────────────────────────────────────────
    const recStartBtn   = document.getElementById('rec-start-btn');
    const recStopBtn    = document.getElementById('rec-stop-btn');
    const replayBtn     = document.getElementById('replay-start-btn');
    const recFilenameEl = document.getElementById('rec-filename');
    let isRecording = false, isReplaying = false;

    function setRecordingState(recording, replaying, fileName) {
      isRecording = recording; isReplaying = replaying;
      recStartBtn.disabled = recording || replaying;
      recStopBtn.disabled  = !recording;
      replayBtn.disabled   = recording || replaying;
      recStartBtn.classList.toggle('recording', recording);
      replayBtn.classList.toggle('replaying', replaying);
      if (fileName != null) recFilenameEl.textContent = fileName || '';
    }
    recStartBtn.addEventListener('click', () => {
      if (!isRecording && !isReplaying) setRecordingState(true, false, 'session.dsrec');
    });
    recStopBtn.addEventListener('click', () => {
      if (isRecording) setRecordingState(false, false, null);
    });
    replayBtn.addEventListener('click', () => {
      if (!isRecording && !isReplaying) { setRecordingState(false, true, 'session.dsrec'); setTimeout(() => setRecordingState(false, false, null), 3000); }
    });

    // ── Tab switching ────────────────────────────────────────────────────
    document.getElementById('tab-scope-btn').addEventListener('click',  () => switchTab('scope'));
    document.getElementById('tab-editor-btn').addEventListener('click', () => switchTab('editor'));

    function switchTab(tab) {
      const scopeEl  = document.getElementById('scope-content');
      const editorEl = document.getElementById('editor-wrap');
      const sBtn = document.getElementById('tab-scope-btn');
      const eBtn = document.getElementById('tab-editor-btn');
      if (tab === 'editor') {
        scopeEl.style.display  = 'none';
        editorEl.style.display = 'flex';
        sBtn.classList.remove('tab-active');
        eBtn.classList.add('tab-active');
      } else {
        scopeEl.style.display  = 'flex';
        editorEl.style.display = 'none';
        sBtn.classList.add('tab-active');
        eBtn.classList.remove('tab-active');
      }
    }

    // ── Controller Editor ────────────────────────────────────────────────
    let editorControls = [];
    let nextCtrlIdx = 0;

    function escJ(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderCanvas() {
      const area = document.getElementById('canvas-area');
      const hint = document.getElementById('canvas-hint');
      area.innerHTML = '';
      if (hint) area.appendChild(hint);
      hint && (hint.style.display = editorControls.length ? 'none' : 'flex');
      for (const ctrl of editorControls) area.appendChild(buildCard(ctrl));
    }

    function buildCard(ctrl) {
      const kindLabel = ctrl.kind === 'pot' ? 'Pot' : ctrl.kind === 'button' ? 'Button' : 'LED';
      const pinOpts  = [...Array(32).keys()].map(i => `<option value="${i}"${ctrl.gpioPin===i?' selected':''}>pin ${i}</option>`).join('');
      const chOpts   = [...Array(12).keys()].map(i => `<option value="${i}"${ctrl.adcChannel===i?' selected':''}>ch ${i}</option>`).join('');
      const taperOpts = ['linear','log','antilog'].map(t => `<option value="${t}"${ctrl.taper===t?' selected':''}>${t}</option>`).join('');
      const modeOpts  = ['momentary','toggle'].map(m => `<option value="${m}"${ctrl.mode===m?' selected':''}>${m}</option>`).join('');
      const card = document.createElement('div');
      card.className = 'ctrl-card';
      card.dataset.kind = ctrl.kind;
      card.style.left = ctrl.pos[0] + 'px';
      card.style.top  = ctrl.pos[1] + 'px';
      card.innerHTML =
        `<div class="card-header"><span class="card-kind">${kindLabel}</span><button class="card-del" title="Remove">×</button></div>` +
        `<div class="card-body">` +
        `<div class="card-field"><label>ID</label><input class="card-inp card-id" value="${escJ(ctrl.id)}"/></div>` +
        `<div class="card-field"><label>Label</label><input class="card-inp card-lbl" value="${escJ(ctrl.label)}"/></div>` +
        (ctrl.kind === 'pot'
          ? `<div class="card-field"><label>ADC ch</label><select class="card-sel card-ch">${chOpts}</select></div>` +
            `<div class="card-field"><label>Taper</label><select class="card-sel card-taper">${taperOpts}</select></div>` +
            `<div class="card-field"><label>Default</label><input class="card-inp card-def" type="number" min="0" max="1" step="0.01" value="${ctrl.def}"/></div>`
          : `<div class="card-field"><label>GPIO pin</label><select class="card-sel card-pin">${pinOpts}</select></div>` +
            (ctrl.kind === 'button' ? `<div class="card-field"><label>Mode</label><select class="card-sel card-mode">${modeOpts}</select></div>` : '')) +
        `</div>`;

      card.querySelector('.card-del').addEventListener('click', () => {
        editorControls = editorControls.filter(c => c !== ctrl);
        card.remove();
        document.getElementById('canvas-hint').style.display = editorControls.length ? 'none' : 'flex';
      });
      card.querySelector('.card-id').addEventListener('input',  e => { ctrl.id    = e.target.value; });
      card.querySelector('.card-lbl').addEventListener('input', e => { ctrl.label = e.target.value; });
      if (ctrl.kind === 'pot') {
        card.querySelector('.card-ch').addEventListener('change',    e => { ctrl.adcChannel = +e.target.value; });
        card.querySelector('.card-taper').addEventListener('change', e => { ctrl.taper = e.target.value; });
        card.querySelector('.card-def').addEventListener('change',   e => { ctrl.def = +e.target.value; });
      } else {
        card.querySelector('.card-pin').addEventListener('change', e => { ctrl.gpioPin = +e.target.value; });
        if (ctrl.kind === 'button') card.querySelector('.card-mode').addEventListener('change', e => { ctrl.mode = e.target.value; });
      }
      makeDraggable(card, ctrl);
      return card;
    }

    function makeDraggable(card, ctrl) {
      const header = card.querySelector('.card-header');
      let drag = false, sx, sy, sl, st;
      header.addEventListener('mousedown', e => {
        if (e.target.closest('.card-del')) return;
        drag = true; sx = e.clientX; sy = e.clientY;
        sl = parseInt(card.style.left)||0; st = parseInt(card.style.top)||0;
        e.preventDefault();
      });
      document.addEventListener('mousemove', e => {
        if (!drag) return;
        card.style.left = Math.max(0, sl + e.clientX - sx) + 'px';
        card.style.top  = Math.max(0, st + e.clientY - sy) + 'px';
        ctrl.pos = [+card.style.left, +card.style.top];
      });
      document.addEventListener('mouseup', () => { drag = false; });
    }

    document.querySelectorAll('.palette-item').forEach(item => {
      item.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', item.dataset.kind));
    });
    const canvasArea = document.getElementById('canvas-area');
    canvasArea.addEventListener('dragover', e => e.preventDefault());
    canvasArea.addEventListener('drop', e => {
      e.preventDefault();
      const kind = e.dataTransfer.getData('text/plain');
      if (!['pot','button','led'].includes(kind)) return;
      const rect = canvasArea.getBoundingClientRect();
      nextCtrlIdx++;
      const ctrl = {
        kind, pos: [Math.max(0, e.clientX - rect.left), Math.max(0, e.clientY - rect.top)],
        id: kind + '_' + nextCtrlIdx,
        label: (kind==='pot'?'Pot':kind==='button'?'Button':'LED') + ' ' + nextCtrlIdx,
        adcChannel: kind==='pot'?0:null, range:kind==='pot'?[0,1]:null,
        taper:kind==='pot'?'linear':null, def:kind==='pot'?0.5:null,
        gpioPin:kind!=='pot'?0:null, mode:kind==='button'?'momentary':null,
      };
      editorControls.push(ctrl);
      canvasArea.appendChild(buildCard(ctrl));
      document.getElementById('canvas-hint').style.display = 'none';
    });

    document.getElementById('save-btn').addEventListener('click', () => {
      vscode.postMessage({ command: 'editorSave', cfg: { pots: [], buttons: [], leds: [] } });
      const st = document.getElementById('save-status');
      st.textContent = 'Saved ✓';
      setTimeout(() => { st.textContent = ''; }, 2000);
    });
  </script>
</body>
</html>
